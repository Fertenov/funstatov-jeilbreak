<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>funstatov // jeilbreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#03080a; --bg-1:#04140b; --bg-2:#02120a;
    --neon:#00ff41; --neon-2:#39ff14; --neon-soft:#7cff9b;
    --neon-dim:rgba(0,255,65,.18); --neon-line:rgba(0,255,65,.07);
    --cyan:#00e5ff; --magenta:#ff2bd6; --discord:#5865F2;
    --txt:#c9ffd6; --muted:#5fae74; --dark:#020a05;
    --panel:rgba(3,18,9,.74); --panel-2:rgba(2,12,6,.92);
    --danger:#ff3b5c; --ok:#00ff41;
    --f-hud:'Orbitron',sans-serif;
    --f-mono:'Share Tech Mono',ui-monospace,Consolas,monospace;
    --f-body:'Rajdhani',system-ui,Segoe UI,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--f-body); color:var(--txt);
    background:var(--bg-0);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative; padding:96px 16px 76px;
    text-shadow:0 0 1px rgba(0,255,65,.25);
  }

  .bg-glow{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 540px at 50% 32%, rgba(0,255,65,.12), transparent 62%),
      radial-gradient(700px 500px at 50% 110%, rgba(0,229,255,.06), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg-0) 70%);}
  .bg-grid{position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, var(--neon-line) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, var(--neon-line) 0 1px, transparent 1px 46px);
    mask-image:radial-gradient(circle at 50% 42%, #000 25%, transparent 82%);}
  .bg-floor{position:fixed; left:50%; bottom:-2px; width:320vw; height:62vh; z-index:1; pointer-events:none;
    transform:translateX(-50%) perspective(220px) rotateX(76deg); transform-origin:bottom center;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,255,65,.22) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(0,255,65,.16) 0 1px, transparent 1px 64px);
    mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.5) 35%, transparent 78%); opacity:.85;}
  .scanlines{position:fixed; inset:0; z-index:40; pointer-events:none; mix-blend-mode:overlay; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 1px, transparent 1px 3px);
    animation:flick 6s steps(60) infinite;}
  @keyframes flick{0%,97%{opacity:.5}98%{opacity:.32}99%{opacity:.6}100%{opacity:.5}}

  .hud-frame{position:fixed; inset:14px; z-index:25; pointer-events:none;}
  .hud-frame .cn{position:absolute; width:34px; height:34px; border:2px solid var(--neon);
    filter:drop-shadow(0 0 6px rgba(0,255,65,.7)); opacity:.8;}
  .hud-frame .tl{top:0;left:0;border-right:0;border-bottom:0}
  .hud-frame .tr{top:0;right:0;border-left:0;border-bottom:0}
  .hud-frame .bl{bottom:0;left:0;border-right:0;border-top:0}
  .hud-frame .br{bottom:0;right:0;border-left:0;border-top:0}

  .lang-switch{position:fixed; top:18px; left:18px; z-index:50; display:flex; gap:4px;
    background:var(--panel); border:1px solid var(--neon-dim); padding:4px;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    backdrop-filter:blur(6px); box-shadow:0 0 18px rgba(0,255,65,.12);}
  .lang-switch button{all:unset; cursor:pointer; font-family:var(--f-hud); font-size:11px; font-weight:700;
    letter-spacing:1.5px; color:var(--muted); padding:7px 11px; transition:.18s;}
  .lang-switch button:hover{color:var(--neon-soft); text-shadow:0 0 8px var(--neon);}
  .lang-switch button.active{color:#02140a; background:var(--neon);
    box-shadow:0 0 14px rgba(0,255,65,.7); text-shadow:none;}

  .card{position:relative; z-index:20; width:min(470px,100%);
    background:linear-gradient(180deg, rgba(0,40,18,.35), var(--panel-2));
    border:1px solid var(--neon-dim); padding:30px 26px 24px;
    box-shadow:0 0 0 1px rgba(0,255,65,.06) inset, 0 0 40px rgba(0,255,65,.12), 0 30px 80px rgba(0,0,0,.7);
    backdrop-filter:blur(7px); animation:cardIn .5s cubic-bezier(.2,.9,.2,1) both; overflow:hidden;}
  @keyframes cardIn{
    0%{opacity:0; transform:translateY(14px) scaleY(.96); filter:blur(6px) hue-rotate(90deg)}
    35%{opacity:1; transform:translateY(0) skewX(-1.5deg); filter:blur(0)}
    38%{transform:skewX(1.2deg)} 41%{transform:skewX(0)}
    100%{transform:none; filter:none}}
  .card .cc{position:absolute; width:18px; height:18px; border:2px solid var(--neon); z-index:6; pointer-events:none;
    filter:drop-shadow(0 0 5px rgba(0,255,65,.6));}
  .card .cc.tl{top:8px;left:8px;border-right:0;border-bottom:0}
  .card .cc.tr{top:8px;right:8px;border-left:0;border-bottom:0}
  .card .cc.bl{bottom:8px;left:8px;border-right:0;border-top:0}
  .card .cc.br{bottom:8px;right:8px;border-left:0;border-top:0}

  .brand{display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:20px;}
  .avatar{width:64px; height:64px; display:grid; place-items:center; font-family:var(--f-hud);
    font-weight:900; font-size:19px; letter-spacing:1px; color:#02140a;
    background:linear-gradient(135deg,var(--neon),var(--cyan));
    clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
    filter:drop-shadow(0 0 12px rgba(0,255,65,.7));}
  .kicker{font-family:var(--f-mono); font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:var(--neon); text-shadow:0 0 10px rgba(0,255,65,.6);}
  .kicker::before{content:"[ "; color:var(--muted)} .kicker::after{content:" ]"; color:var(--muted)}

  .glitch{position:relative; font-family:var(--f-hud); font-weight:900; font-size:21px; letter-spacing:1px;
    margin:2px 0 0; text-align:center; color:#eafff0; text-transform:uppercase;
    text-shadow:0 0 12px rgba(0,255,65,.45);}
  .glitch::before,.glitch::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    overflow:hidden; text-align:center;}
  .glitch::before{color:var(--cyan); clip-path:inset(0 0 55% 0); animation:gTop 3.2s infinite steps(2);}
  .glitch::after{color:var(--magenta); clip-path:inset(55% 0 0 0); animation:gBot 2.7s infinite steps(2);}
  @keyframes gTop{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,-1px);opacity:.9}96%{transform:translate(2px,1px);opacity:.7}}
  @keyframes gBot{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(3px,1px);opacity:.9}95%{transform:translate(-2px,-1px);opacity:.7}}
  p.sub{margin:6px 0 0; font-size:13.5px; color:var(--muted); text-align:center; letter-spacing:.4px;}

  .panel{background:rgba(2,14,7,.6); border:1px solid var(--neon-dim); padding:16px; position:relative;}
  .panel + .panel{margin-top:14px;}
  .panel::after{content:""; position:absolute; top:-1px; left:14px; width:34px; height:2px; background:var(--neon);
    box-shadow:0 0 8px var(--neon);}

  label.field{display:block; font-family:var(--f-mono); font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--neon-soft); margin:0 0 6px;}
  label.field::before{content:"> "; color:var(--muted);}
  .inp{width:100%; background:var(--dark); border:1px solid var(--neon-dim); color:var(--neon-soft);
    padding:11px 12px; font-size:14px; font-family:var(--f-mono); outline:none; border-radius:2px; transition:.18s;
    letter-spacing:.5px;}
  .inp::placeholder{color:rgba(95,174,116,.5)}
  .inp:focus{border-color:var(--neon); box-shadow:0 0 0 1px var(--neon), 0 0 16px rgba(0,255,65,.35);
    background:#031a0c; color:#eafff0;}
  .row{display:flex; gap:10px; align-items:end;}
  .row .grow{flex:1}

  .cap-wrap{display:flex; gap:10px; align-items:center;}
  canvas.cap{border:1px solid var(--neon-dim); background:#020a05; cursor:pointer; flex:0 0 auto; border-radius:2px;
    box-shadow:0 0 12px rgba(0,255,65,.18) inset;}
  .cap-refresh{all:unset; cursor:pointer; width:40px; height:40px; display:grid; place-items:center;
    border:1px solid var(--neon-dim); color:var(--neon); font-size:17px; border-radius:2px; transition:.18s;
    font-family:var(--f-mono);}
  .cap-refresh:hover{border-color:var(--neon); box-shadow:0 0 12px rgba(0,255,65,.5); transform:rotate(180deg);}

  .btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px 14px; font-family:var(--f-hud); font-weight:700; font-size:13px; letter-spacing:1.5px;
    text-transform:uppercase; text-align:center; transition:.18s;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
  .btn-primary{background:linear-gradient(135deg,var(--neon),var(--neon-2)); color:#02140a;
    filter:drop-shadow(0 0 7px rgba(0,255,65,.55));}
  .btn-primary:hover{filter:drop-shadow(0 0 16px rgba(0,255,65,.9)) brightness(1.08); transform:translateY(-1px);}
  .btn-green{background:linear-gradient(135deg,var(--neon-2),var(--cyan)); color:#02140a;
    filter:drop-shadow(0 0 7px rgba(0,229,255,.5));}
  .btn-green:hover{filter:drop-shadow(0 0 16px rgba(0,229,255,.85)) brightness(1.08); transform:translateY(-1px);}
  .btn-ghost{background:rgba(0,255,65,.07); border:0; color:var(--neon-soft);
    box-shadow:inset 0 0 0 1px var(--neon-dim); filter:drop-shadow(0 0 4px rgba(0,255,65,.2));}
  .btn-ghost:hover{background:rgba(0,255,65,.16); color:#eafff0; filter:drop-shadow(0 0 10px rgba(0,255,65,.5));}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; filter:none;}

  .switch-line{margin-top:16px; text-align:center; font-size:13px; color:var(--muted); font-family:var(--f-mono);}
  .switch-line a{color:var(--neon); cursor:pointer; font-weight:700; text-decoration:none;
    text-shadow:0 0 8px rgba(0,255,65,.5);}
  .switch-line a:hover{text-decoration:underline; text-shadow:0 0 14px var(--neon);}
  .msg{margin-top:12px; font-size:13px; text-align:center; min-height:18px; font-family:var(--f-mono);}
  .msg.err{color:var(--danger); text-shadow:0 0 10px rgba(255,59,92,.5);}
  .msg.ok{color:var(--ok);}

  .prog-head{display:flex; justify-content:space-between; align-items:center; font-family:var(--f-mono);
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:9px;}
  .prog-pct{color:#02140a; background:var(--neon); padding:2px 9px; font-weight:700; letter-spacing:0;
    box-shadow:0 0 12px rgba(0,255,65,.6); clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);}
  .bar{height:12px; background:var(--dark); border:1px solid var(--neon-dim); position:relative; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0%; position:relative;
    background:linear-gradient(90deg,var(--neon-2),var(--neon),var(--cyan));
    box-shadow:0 0 16px rgba(0,255,65,.7); transition:width 1.4s ease;}
  .bar::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 9px, rgba(2,10,5,.85) 9px 11px);}
  .status-line{margin-top:9px; font-family:var(--f-mono); font-size:12px; letter-spacing:1px; color:var(--neon-soft);
    display:flex; align-items:center; gap:8px;}
  .status-line .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); box-shadow:0 0 8px currentColor; flex:0 0 auto;}
  .status-line.wait .dot{background:var(--muted);}
  .status-line.check .dot{background:var(--cyan); animation:blink .7s steps(2) infinite;}
  .status-line.ok .dot{background:var(--neon);}
  .status-line.ok{color:var(--neon);}
  .cd-num{color:var(--neon); font-weight:700; text-shadow:0 0 10px var(--neon); font-family:var(--f-hud);}
  @keyframes blink{50%{opacity:.25}}

  .ad{display:flex; align-items:center; gap:14px; padding:14px; cursor:pointer; margin-top:14px;
    background:linear-gradient(135deg, rgba(88,101,242,.16), rgba(0,255,65,.08));
    border:1px solid var(--neon-dim); transition:.2s; position:relative;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));}
  .ad:hover{border-color:var(--neon); box-shadow:0 0 22px rgba(0,255,65,.3); transform:translateY(-1px);}
  .ad.cooling{cursor:progress; opacity:.92;}
  .ad.cooling:hover{transform:none; box-shadow:none;}
  .ad.locked{opacity:.55; cursor:not-allowed; pointer-events:none;}
  .ad.locked:hover{transform:none; box-shadow:none; border-color:var(--neon-dim);}
  .ad .dicon{width:48px; height:48px; flex:0 0 auto; display:grid; place-items:center; color:#02140a;
    background:linear-gradient(135deg,var(--discord),var(--neon));
    clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);
    filter:drop-shadow(0 0 8px rgba(88,101,242,.6));}
  .ad .dicon svg{width:26px; height:26px; fill:currentColor;}
  .ad .txt{flex:1; min-width:0}
  .ad .txt b{display:block; font-family:var(--f-hud); font-size:13px; color:#eafff0; letter-spacing:.5px;}
  .ad .go{flex:0 0 auto; padding:9px 14px; background:var(--neon); color:#02140c; font-family:var(--f-hud);
    font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    box-shadow:0 0 12px rgba(0,255,65,.6); clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));}

  .ad-sponsored{display:flex; align-items:center; gap:14px; padding:14px; margin-top:14px;
    background:rgba(58,58,58,.18);
    border:1px dashed rgba(160,160,160,.35);
    position:relative;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    text-shadow:none;}
  .ad-sponsored .dicon{width:48px; height:48px; flex:0 0 auto; display:grid; place-items:center;
    background:rgba(120,120,120,.25);
    color:#a0a0a0;
    clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);
    font-family:var(--f-hud); font-weight:900; font-size:22px; letter-spacing:0;}
  .ad-sponsored .txt{flex:1; min-width:0}
  .ad-sponsored .txt b{display:block; font-family:var(--f-hud); font-size:13px; color:#b8b8b8; letter-spacing:.5px; font-weight:500;}
  .ad-sponsored .txt span{display:block; font-family:var(--f-mono); font-size:11px; color:#7a7a7a; margin-top:3px; letter-spacing:.5px;}
  .ad-sponsored .go{flex:0 0 auto; padding:9px 14px;
    background:rgba(120,120,120,.15); color:#888;
    font-family:var(--f-hud); font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    border:1px solid rgba(140,140,140,.3);
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));}

  .note{display:flex; align-items:center; gap:10px; margin-top:14px; padding:11px 12px;
    background:rgba(2,14,7,.6); border:1px solid var(--neon-dim); font-size:12px; color:var(--muted);
    font-family:var(--f-mono);}
  .note .q{width:22px; height:22px; flex:0 0 auto; display:grid; place-items:center; color:var(--neon);
    border:1px solid var(--neon); font-weight:700; box-shadow:0 0 8px rgba(0,255,65,.4);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  .note b{color:var(--neon-soft)}

  .opts{display:grid; gap:14px;}
  .opt{display:flex; gap:14px; align-items:center; padding:16px; cursor:pointer; text-align:left;
    border:1px solid var(--neon-dim); background:rgba(2,14,7,.55); transition:.2s; position:relative;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
  .opt:hover{transform:translateY(-2px); border-color:var(--neon); box-shadow:0 0 24px rgba(0,255,65,.25);}
  .opt .badge{width:48px; height:48px; flex:0 0 auto; display:grid; place-items:center; font-size:20px; color:#02140a;
    clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);}
  .opt.free .badge{background:linear-gradient(135deg,var(--neon-2),var(--neon)); filter:drop-shadow(0 0 8px rgba(0,255,65,.5));}
  .opt.paid .badge{background:linear-gradient(135deg,var(--cyan),var(--neon)); filter:drop-shadow(0 0 10px rgba(0,229,255,.6));}
  .opt.paid{animation:paidGlow 2.6s ease-in-out infinite;}
  @keyframes paidGlow{0%,100%{box-shadow:0 0 0 1px rgba(0,229,255,.2)}50%{box-shadow:0 0 22px rgba(0,229,255,.35)}}
  .opt .meta b{display:block; font-family:var(--f-hud); font-size:15px; color:#eafff0; letter-spacing:.5px;}
  .opt .meta span{display:block; font-size:12px; color:var(--muted); margin-top:3px; font-family:var(--f-mono);}
  .opt .chev{margin-left:auto; color:var(--neon); font-size:20px; text-shadow:0 0 8px var(--neon);}

  .steps-title{text-align:center; font-family:var(--f-mono); font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:var(--muted); margin:0 0 12px;}
  .code{margin-top:12px; background:#010803; border:1px solid var(--neon-dim); padding:14px;
    font-family:var(--f-mono); font-size:12px; color:var(--neon-soft); white-space:pre-wrap; word-break:break-word;
    max-height:170px; overflow:auto; line-height:1.5; text-shadow:0 0 6px rgba(0,255,65,.3); border-radius:2px;}
  .code::-webkit-scrollbar{width:8px} .code::-webkit-scrollbar-thumb{background:var(--neon-dim)}

  .back{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono);
    font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:14px;}
  .back:hover{color:var(--neon); text-shadow:0 0 8px var(--neon);}
  .back::before{content:"◄ ";}

  .footer{position:fixed; bottom:16px; left:0; right:0; z-index:30; text-align:center;
    font-family:var(--f-mono); font-size:12.5px; color:var(--muted); letter-spacing:.5px;}
  .footer a{color:var(--neon); text-decoration:none; font-weight:700; text-shadow:0 0 10px rgba(0,255,65,.5);}
  .footer a:hover{text-decoration:underline; text-shadow:0 0 16px var(--neon);}
  .footer .sep{color:var(--neon-dim); margin:0 7px;}

  .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:70;
    background:var(--panel-2); border:1px solid var(--neon); color:#eafff0; padding:11px 18px;
    font-family:var(--f-mono); font-size:13px; letter-spacing:.5px; opacity:0; pointer-events:none; transition:.3s;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    box-shadow:0 0 24px rgba(0,255,65,.4);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast::before{content:"// "; color:var(--neon);}

  @media (max-width:480px){ .card{padding:24px 16px} .glitch{font-size:18px} .bg-floor{height:48vh}
    .ad, .ad-sponsored{flex-wrap:wrap} .ad .go, .ad-sponsored .go{width:100%; margin-top:4px;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="bg-floor"></div>
  <div class="scanlines"></div>
  <div class="hud-frame"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span></div>

  <nav class="lang-switch" id="langSwitch" aria-label="Language">
    <button data-lang="en">EN</button>
    <button data-lang="ru">RU</button>
    <button data-lang="es">ES</button>
  </nav>

  <main class="card" id="card" role="main">
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
  </main>

  <div class="footer">
    <span data-i18n="footer_support"></span><span class="sep">//</span><span data-i18n="footer_collab"></span>
    <span class="sep">//</span>
    <a href="https://t.me/funstatjeilscript" target="_blank" rel="noopener">@funstatjeilscript</a>
  </div>

  <div class="toast" id="toast"></div>

let LANG = localStorage.getItem('fs_lang') || (navigator.language.startsWith('ru')?'ru':navigator.language.startsWith('es')?'es':'en');
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.lang===LANG));
}

const USERS_KEY='fs_users', SESSION_KEY='fs_session';
const getUsers = ()=> JSON.parse(localStorage.getItem(USERS_KEY)||'{}');
const setUsers = u => localStorage.setItem(USERS_KEY, JSON.stringify(u));
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)^s.charCodeAt(i); h>>>=0; } return 'h'+h.toString(36); }
const getSession = ()=> localStorage.getItem(SESSION_KEY);
const setSession = n => n ? localStorage.setItem(SESSION_KEY,n) : localStorage.removeItem(SESSION_KEY);

function newCapText(len=5){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function drawCap(canvas, text){
  const w=canvas.width, h=canvas.height, ctx=canvas.getContext('2d');
  ctx.fillStyle='#020a05'; ctx.fillRect(0,0,w,h);
  const pal=['#00ff41','#39ff14','#7cff9b','#00e5ff','#caffd6'];
  for(let i=0;i<46;i++){ ctx.fillStyle=pal[i%pal.length]; ctx.globalAlpha=.22;
    ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  ctx.globalAlpha=1;
  for(let i=0;i<5;i++){ ctx.strokeStyle=pal[i%pal.length]; ctx.globalAlpha=.45; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(Math.random()*w,Math.random()*h); ctx.lineTo(Math.random()*w,Math.random()*h); ctx.stroke(); }
  ctx.globalAlpha=1;
  const step=w/(text.length+1);
  for(let i=0;i<text.length;i++){
    ctx.save();
    ctx.translate(step*(i+1), h/2);
    ctx.rotate((Math.random()-.5)*0.45);
    ctx.font='bold '+(20+Math.random()*6)+'px "Share Tech Mono", monospace';
    ctx.fillStyle=pal[(i+1)%pal.length];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
    ctx.fillText(text[i],0,0);
    ctx.restore();
  }
}
function initCaptcha(canvas, input){
  const gen = ()=>{ const txt=newCapText(); canvas.dataset.cap=txt; drawCap(canvas,txt); input.value=''; };
  canvas.addEventListener('click', gen);
  gen();
  return ()=> (input.value||'').trim().toUpperCase() === canvas.dataset.cap;
}

let toastTimer;
function toast(msg, ok=true){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.borderColor = ok?'var(--neon)':'var(--danger)';
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ============ ГЛАВНОЕ ИСПРАВЛЕНИЕ: одна проверка за раз ============ */
function handleVerify(platform){
  // Если ЛЮБАЯ проверка уже идёт — блокируем, показываем подсказку
  if(freeState.discord.verifying || freeState.youtube.verifying){
    const statusLine = card.querySelector('#statusLine');
    const statusTxt  = card.querySelector('#statusTxt');
    if(statusLine && statusTxt){
      statusLine.className = 'status-line check';
      statusTxt.innerHTML = t('st_busy');
      // мигнуть красным на секунду
      statusTxt.style.color = 'var(--danger)';
      setTimeout(()=>{
        statusTxt.style.color = '';
        if(!freeState.discord.verifying && !freeState.youtube.verifying){
          statusLine.className = 'status-line wait';
          statusTxt.textContent = t('st_wait');
        }
      }, 1500);
    }
    return;
  }

  const state = freeState[platform];
  if(state.verified) return;

  state.verifying = true;
  const url = platform === 'discord' ? DISCORD : YOUTUBE;
  window.open(url, '_blank', 'noopener');

  // Блокируем ОБЕ кнопки на время проверки
  const dcAd = card.querySelector('#dcAd');
  const ytAd = card.querySelector('#ytAd');
  const dcBtn = card.querySelector('#dcBtn');
  const ytBtn = card.querySelector('#ytBtn');

  if(dcAd) dcAd.classList.add('locked');
  if(ytAd) ytAd.classList.add('locked');

  // Активная кнопка — показывает "ждите", неактивная — просто заблокирована
  if(platform === 'discord'){
    dcAd.classList.remove('locked');
    dcAd.classList.add('cooling');
    dcBtn.textContent = t('dc_wait');
    dcBtn.style.pointerEvents = 'none';
  }else{
    ytAd.classList.remove('locked');
    ytAd.classList.add('cooling');
    ytBtn.textContent = t('yt_wait');
    ytBtn.style.pointerEvents = 'none';
  }

  const statusLine = card.querySelector('#statusLine');
  const statusTxt  = card.querySelector('#statusTxt');
  const barEl      = card.querySelector('#barFill');
  const pctEl      = card.querySelector('#pct');

  statusLine.className = 'status-line check';

  const currentProgress = (freeState.discord.verified ? 50 : 0) + (freeState.youtube.verified ? 50 : 0);
  const targetWidth = currentProgress + 50;

  barEl.style.transition = 'none';
  barEl.style.width = currentProgress + '%';
  // форсим reflow чтобы transition сработал с нуля
  void barEl.offsetWidth;
  barEl.style.transition = `width ${CD_SECONDS}s linear`;
  requestAnimationFrame(()=>{
    barEl.style.width = targetWidth + '%';
    pctEl.textContent = targetWidth + '%';
  });

  let n = CD_SECONDS;
  freeState.cdInt = setInterval(()=>{
    n--;
    statusTxt.innerHTML = t('st_verifying').replace('{s}', `<span class="cd-num">${n}</span>`);

    if(n <= 0){
      clearInterval(freeState.cdInt);
      freeState.cdInt = null;
      state.verifying = false;
      state.verified = true;

      const finalProgress = (freeState.discord.verified ? 50 : 0) + (freeState.youtube.verified ? 50 : 0);
      pctEl.textContent = finalProgress + '%';
      barEl.style.transition = 'width 0.5s ease';
      barEl.style.width = finalProgress + '%';

      if(platform === 'discord'){
        dcBtn.textContent = '✓';
      }else{
        ytBtn.textContent = '✓';
      }

      if(freeState.discord.verified && freeState.youtube.verified){
        // обе готовы
        statusLine.className = 'status-line ok';
        statusTxt.textContent = t('st_ok');
        setTimeout(()=> renderUnlocked(), 800);
      }else{
        // одна готова — разблокируем вторую
        statusLine.className = 'status-line wait';
        statusTxt.textContent = t('st_wait');
        if(dcAd) dcAd.classList.remove('locked','cooling');
        if(ytAd) ytAd.classList.remove('locked','cooling');
        // восстанавливаем текст кнопки оставшейся
        if(!freeState.discord.verified && dcBtn) dcBtn.textContent = t('dc_btn');
        if(!freeState.youtube.verified && ytBtn) ytBtn.textContent = t('yt_btn');
        if(dcBtn) dcBtn.style.pointerEvents = '';
        if(ytBtn) ytBtn.style.pointerEvents = '';
      }
    }
  }, 1000);
}

  const kickerTxt = t('kicker_unlock');
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <button class="back" id="back"><span data-i18n="back"></span></button>
    <div class="brand">
      <div class="avatar">FJ</div>
      <div class="kicker">${kickerTxt}</div>
    </div>
    <div class="panel">
      <div class="prog-head"><span data-i18n="ads_viewed"></span><span class="prog-pct" id="pct">0%</span></div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <div class="status-line wait" id="statusLine"><span class="dot"></span><span id="statusTxt" data-i18n="st_wait"></span></div>
    </div>
    <div class="ad" id="dcAd" role="button" tabindex="0">
      <div class="dicon">${DISCORD_SVG}</div>
      <div class="txt"><b data-i18n="dc_title"></b></div>
      <span class="go" id="dcBtn" data-i18n="dc_btn"></span>
    </div>
    <div class="ad" id="ytAd" role="button" tabindex="0" style="margin-top:14px">
      <div class="dicon" style="background:linear-gradient(135deg,#ff0000,#ff5555);filter:drop-shadow(0 0 8px rgba(255,0,0,.6))">${YOUTUBE_SVG}</div>
      <div class="txt"><b data-i18n="yt_title"></b></div>
      <span class="go" id="ytBtn" data-i18n="yt_btn"></span>
    </div>
    <div class="ad-sponsored" aria-label="Sponsored ad placeholder">
      <div class="dicon">?</div>
      <div class="txt">
        <b data-i18n="ad_title"></b>
        <span data-i18n="ad_sub"></span>
      </div>
      <span class="go" data-i18n="ad_btn"></span>
    </div>`;
  applyLang();
  card.querySelector('#back').onclick = ()=>{ clearCd(); viewMenu(); };

  const dcAd = card.querySelector('#dcAd');
  const ytAd = card.querySelector('#ytAd');

  dcAd.addEventListener('click', ()=> handleVerify('discord'));
  dcAd.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleVerify('discord'); } });

  ytAd.addEventListener('click', ()=> handleVerify('youtube'));
  ytAd.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleVerify('youtube'); } });
}

function renderUnlocked(){
  const kickerTxt = t('kicker_unlock');
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <button class="back" id="back"><span data-i18n="back"></span></button>
    <div class="brand">
      <div class="avatar">FJ</div>
      <div class="kicker">${kickerTxt}</div>
    </div>
    <div class="panel">
      <div class="prog-head"><span data-i18n="ads_viewed"></span><span class="prog-pct">100%</span></div>
      <div class="bar"><i id="barFill" style="width:100%"></i></div>
      <div class="status-line ok"><span class="dot"></span><span data-i18n="st_ok"></span></div>
    </div>
    <div class="panel" style="margin-top:14px;border-color:rgba(0,255,65,.5)">
      <p class="steps-title" style="color:var(--neon)" data-i18n="unlocked_t"></p>
      <p class="sub" style="margin:0 0 4px" data-i18n="unlocked_d"></p>
      <div class="code" id="codeBox"></div>
      <div style="height:12px"></div>
      <button class="btn btn-green" id="copyBtn" data-i18n="copy"></button>
    </div>
    <div class="ad-sponsored" aria-label="Sponsored ad placeholder">
      <div class="dicon">?</div>
      <div class="txt">
        <b data-i18n="ad_title"></b>
        <span data-i18n="ad_sub"></span>
      </div>
      <span class="go" data-i18n="ad_btn"></span>
    </div>`;
  applyLang();
  card.querySelector('#back').onclick = viewMenu;
  card.querySelector('#codeBox').textContent = t('script_ph');
  card.querySelector('#copyBtn').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(t('script_ph')); toast(t('toast_copy')); }
    catch{ const ta=document.createElement('textarea'); ta.value=t('script_ph'); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(t('toast_copy')); }
  };
}

function viewPaid(){
  page = 'paid';
  const titleTxt = t('paid_t');
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <button class="back" id="back"><span data-i18n="back"></span></button>
    <div class="brand">
      <div class="avatar" style="background:linear-gradient(135deg,var(--cyan),var(--neon))">◆</div>
      ${glitchTitle(titleTxt)}
      <p class="sub" data-i18n="paid_d"></p>
    </div>
    <div class="panel">
      <div class="prog-head"><span data-i18n="price"></span><span class="prog-pct" style="background:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.6)">PRO</span></div>
      <div class="row" style="margin-top:6px">
        <button class="btn btn-ghost grow" disabled data-i18n="m_card"></button>
        <button class="btn btn-ghost grow" disabled data-i18n="m_crypto"></button>
      </div>
      <div style="height:12px"></div>
      <a class="btn btn-primary" href="${TG}" target="_blank" rel="noopener" data-i18n="btn_buy"></a>
      <div class="note" style="margin-top:14px"><span class="q">!</span><span data-i18n="buy_note"></span></div>
    </div>`;
  applyLang();
  card.querySelector('#back').onclick = viewMenu;
}

document.getElementById('langSwitch').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(LANG === b.dataset.lang) return;
  LANG = b.dataset.lang;
  localStorage.setItem('fs_lang', LANG);
  applyLang();
  rerenderView();
});

function boot(){
  applyLang();
  if(getSession() && getUsers()[getSession()]) viewMenu();
  else viewAuth('reg');
}
boot();
</script>
</body>
</html>
